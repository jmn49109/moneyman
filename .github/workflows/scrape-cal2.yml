name: Scrape Cal Account 2

on:
  schedule:
    # Runs 30 minutes after the main run (13:35 and 01:35 Israel Time)
    - cron: "35 10,22 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Run Moneyman
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG_CAL2 }}
          TZ: Asia/Jerusalem
        run: |
          docker run --rm -e MONEYMAN_CONFIG -e TZ ghcr.io/jmn49109/moneyman:latest
